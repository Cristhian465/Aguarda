name: Release

# Se ejecuta al subir un tag como v1.0:  git tag v1.0 && git push origin v1.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Publicar Release con el APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Permiso de ejecución para gradlew
        run: chmod +x gradlew

      - name: Pruebas unitarias
        run: ./gradlew testDebugUnitTest

      # Con el keystore en los Secrets: APK de release alineado y firmado.
      - name: APK firmado
        if: env.KEYSTORE_BASE64 != ''
        run: |
          ./gradlew assembleRelease
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
          herramientas=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          sin_firma=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          "$herramientas/zipalign" -f -p 4 "$sin_firma" "$RUNNER_TEMP/alineado.apk"
          "$herramientas/apksigner" sign \
            --ks "$RUNNER_TEMP/keystore.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "AguardApp-${GITHUB_REF_NAME}.apk" \
            "$RUNNER_TEMP/alineado.apk"
          "$herramientas/apksigner" verify "AguardApp-${GITHUB_REF_NAME}.apk"
          rm -f "$RUNNER_TEMP/keystore.jks"

      # Sin keystore: se publica el APK de depuración para que la Release no quede vacía.
      - name: APK de depuración (no hay keystore en los Secrets)
        if: env.KEYSTORE_BASE64 == ''
        run: |
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "AguardApp-${GITHUB_REF_NAME}-debug.apk"

      - name: Publicar la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          archivos=(AguardApp-*.apk informes/*.docx)
          gh release create "$GITHUB_REF_NAME" "${archivos[@]}" \
            --title "AguardApp $GITHUB_REF_NAME" \
            --generate-notes
