name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar, pruebas y lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Permiso de ejecución para gradlew
        run: chmod +x gradlew

      - name: Pruebas unitarias
        run: ./gradlew testDebugUnitTest

      # La cobertura informa pero no bloquea: si falla el reporte, el resto sigue.
      - name: Cobertura de pruebas
        continue-on-error: true
        run: |
          ./gradlew createDebugUnitTestCoverageReport
          python3 .github/scripts/cobertura.py >> "$GITHUB_STEP_SUMMARY"

      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug

      - name: Lint
        run: ./gradlew lintDebug

      - name: Subir APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AguardApp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Subir reportes (pruebas, cobertura y lint)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: |
            app/build/reports/tests/
            app/build/reports/coverage/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  detekt:
    name: Análisis estático (detekt)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DETEKT_VERSION: 1.23.8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Solo informa: los hallazgos quedan en el resumen y en el reporte, sin bloquear el merge.
      - name: Ejecutar detekt
        run: |
          set +e
          curl -sSLf -o detekt.jar "https://github.com/detekt/detekt/releases/download/v${DETEKT_VERSION}/detekt-cli-${DETEKT_VERSION}-all.jar"
          java -jar detekt.jar \
            --input app/src/main/java \
            --config config/detekt/detekt.yml \
            --build-upon-default-config \
            --report html:detekt.html \
            --report md:detekt.md
          codigo=$?
          {
            echo "## detekt"
            if [ "$codigo" -eq 0 ]; then
              echo "Sin hallazgos."
            elif [ -f detekt.md ]; then
              echo "Hay hallazgos (no bloquean el merge). El reporte completo está en el artefacto detekt."
              echo
              head -c 60000 detekt.md
            else
              echo "detekt no pudo ejecutarse (código $codigo). Revisa el log de este paso."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Subir reporte de detekt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt
          path: |
            detekt.html
            detekt.md
          if-no-files-found: ignore
